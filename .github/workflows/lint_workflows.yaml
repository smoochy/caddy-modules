name: Lint workflows

on:
  push:
    branches: ["main"]
    paths:
      - .github/workflows/**

  pull_request:
    paths:
      - .github/workflows/**

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-workflows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
